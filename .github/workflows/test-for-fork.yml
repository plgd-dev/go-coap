# Workflow to run tests for PRs from forked repository
name: Test for forked repository

# Run on pull requests events from forked repository
on: [pull_request]

jobs:
  test-for-fork:
    # Run only for forked repository
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Set up Go >=1.26
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26"
          check-latest: true

      - run: go version

      - name: Install libcoap tools
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y libcoap3-bin
            sudo ln -sf /usr/bin/coap-client-notls /usr/bin/coap-client
          elif [ "${{ matrix.os }}" == "macOS-latest" ]; then
            brew install libcoap
          fi
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            # fail instead of silently skipping the libcoap tests
            command -v coap-client
            coap-client -h 2>&1 | head -n 1 || true
            test -x "$(command -v coap-client)"
            command -v coap-server || command -v coap-server-notls
          fi
        shell: bash

      # Checks-out repository under $GITHUB_WORKSPACE
      - name: Checkout
        uses: actions/checkout@v7

      # Build everything
      - name: Run a build
        run: go build ./...

      # Runs a single command using the runners shell, -p1 for `race: limit on 8128 simultaneously alive goroutines is exceeded, dying` at macos
      - name: Run a test
        run: go test -v -race ./... -coverpkg=./... -covermode=atomic -coverprofile=./coverage.txt
