# Workflow to run tests, publish coverage to codecov and run SonarCloud scan
name: Test

# Run for events in main repository (for forked repository look in test-for-fork.yml)
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  qblock:
    if: github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test-qblock.yml

  oscore-interop:
    if: github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go >=1.26
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26"
          check-latest: true

      - name: Install libcoap build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev
        shell: bash

      - name: Build pinned libcoap with OSCORE
        run: |
          source_dir="$RUNNER_TEMP/libcoap-source"
          build_dir="$RUNNER_TEMP/libcoap-build"
          prefix="$RUNNER_TEMP/libcoap-install"
          tools="$RUNNER_TEMP/libcoap-tools"
          revision="cfa1cf3d1721c1598c40a624b3b0028dd1bbe178"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/obgm/libcoap.git
          git -C "$source_dir" fetch --depth=1 origin "$revision"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
          cmake -S "$source_dir" -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DENABLE_Q_BLOCK=ON -DENABLE_DTLS=ON -DDTLS_BACKEND=openssl \
            -DENABLE_OSCORE=ON -DENABLE_DOCS=OFF -DENABLE_TESTS=OFF \
            -DENABLE_EXAMPLES=ON -DBUILD_SHARED_LIBS=OFF
          cmake --build "$build_dir" --parallel 2
          cmake --install "$build_dir"
          mkdir -p "$tools"
          clients=("$prefix"/bin/coap-client*)
          servers=("$prefix"/bin/coap-server*)
          test -x "${clients[0]}"
          test -x "${servers[0]}"
          ln -s "${clients[0]}" "$tools/coap-client"
          ln -s "${clients[0]}" "$tools/coap-client-notls"
          ln -s "${servers[0]}" "$tools/coap-server"
          ln -s "${servers[0]}" "$tools/coap-server-notls"
          echo "$tools" >> "$GITHUB_PATH"
          git -C "$source_dir" rev-parse HEAD
        shell: bash

      - name: Run bidirectional OSCORE interoperability tests
        run: go test ./udp/client -run 'TestLibCoAP(Server|Client).*OSCORE' -count=1 -v
        env:
          GOCOAP_REQUIRE_LIBCOAP_OSCORE: "1"
          LIBCOAP_QBLOCK_REQUIRED: "1"
          LIBCOAP_QBLOCK_MODE: enabled
        shell: bash

  test:
    # don't run for forks
    if: github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      # Checks-out repository under $GITHUB_WORKSPACE with tags and history (needed by "SonarCloud Scan" step)
      - name: Full checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full clone for SonarCloud

      - name: Set up Go >=1.26
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.26"
          check-latest: true

      - run: go version

      - name: Install libcoap tools
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo apt-get update
            sudo apt-get install -y libcoap3-bin
            sudo ln -sf /usr/bin/coap-client-openssl /usr/bin/coap-client
          elif [ "${{ matrix.os }}" == "macOS-latest" ]; then
            brew install cmake openssl@3
            source_dir="$RUNNER_TEMP/libcoap-source"
            build_dir="$RUNNER_TEMP/libcoap-build"
            prefix="$RUNNER_TEMP/libcoap-install"
            tools="$RUNNER_TEMP/libcoap-tools"
            # Upstream fix for Q-Block2 reassembled-body length handling.
            revision="cfa1cf3d1721c1598c40a624b3b0028dd1bbe178"
            git init "$source_dir"
            git -C "$source_dir" remote add origin https://github.com/obgm/libcoap.git
            git -C "$source_dir" fetch --depth=1 origin "$revision"
            git -C "$source_dir" checkout --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = "$revision"
            cmake -S "$source_dir" -B "$build_dir" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
              -DENABLE_Q_BLOCK=ON -DENABLE_DTLS=ON -DDTLS_BACKEND=openssl \
              -DENABLE_OSCORE=OFF -DENABLE_DOCS=OFF -DENABLE_TESTS=OFF \
              -DENABLE_EXAMPLES=ON -DBUILD_SHARED_LIBS=OFF
            cmake --build "$build_dir" --parallel 2
            cmake --install "$build_dir"
            mkdir -p "$tools"
            clients=("$prefix"/bin/coap-client*)
            servers=("$prefix"/bin/coap-server*)
            test -x "${clients[0]}"
            test -x "${servers[0]}"
            ln -s "${clients[0]}" "$tools/coap-client"
            ln -s "${servers[0]}" "$tools/coap-server"
            echo "$tools" >> "$GITHUB_PATH"
            export PATH="$tools:$PATH"
            git -C "$source_dir" rev-parse HEAD
          fi
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            # fail instead of silently skipping the libcoap tests
            command -v coap-client
            coap-client -h 2>&1 | head -n 1 || true
            test -x "$(command -v coap-client)"
            command -v coap-server || command -v coap-server-notls
          fi
        shell: bash
      # Build everything
      - name: Run a build
        run: go build ./...
        shell: bash

      # Runs a single command using the runners shell, -p1 for `race: limit on 8128 simultaneously alive goroutines is exceeded, dying` at macos
      - name: Run a test
        run: go test -v -race ./... -coverpkg=./... -covermode=atomic -coverprofile=./coverage.txt -json > ./report.json
        shell: bash
      
      - name: Dump test report
        if: always()
        run: cat ./report.json
        shell: bash

      - name: Prepare upload files
        run: |
          mkdir -p ./outputs
          cp ./coverage.txt ./outputs/${{ matrix.os }}.coverage.txt
          cp ./report.json ./outputs/${{ matrix.os }}.report.json
        shell: bash

      - name: Upload coverage and report files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ hashFiles('./outputs') || 'none' }}
          path: ./outputs
          retention-days: 1
          if-no-files-found: warn
  
  coverage-sonar-cloud-scan:
    needs: test
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./outputs

      - name: Prepare coverage and report files
        run: |
          mkdir -p .tmp/coverage
          mkdir -p .tmp/report
          find ./outputs -name "*.coverage.txt" -exec sh -c 'cp $1 .tmp/coverage/$(echo $1 | sed "s/[\/.]/-/g" ).coverage.txt' _ {}  \;
          find ./outputs -name "*.report.json" -exec sh -c 'cp $1 .tmp/report/$(echo $1 | sed "s/[\/.]/-/g" ).report.json' _ {}  \;

      - name: Code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: .tmp/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
